<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Precision Pilot — web client</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0a0a0a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        border: 1px solid rgba(196, 154, 58, 0.3);
        border-radius: 0.75rem;
        padding: 1.75rem;
        background: #111111;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
        color: #f3f4f6;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: #9ca3af;
        line-height: 1.65;
      }
      .gold {
        color: #c49a3a;
      }
      code {
        font-size: 0.75rem;
        color: #c49a3a;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card" role="region" aria-label="Precision Pilot embedded web client">
      <h1><span class="gold">Precision Pilot</span> — web client</h1>
      <p>
        This is a <strong>placeholder</strong> loaded inside the marketing site iframe. Replace files in
        <code>public/precision-pilot/app/</code> with your production build. Use Vite
        <code>base: '/precision-pilot/app/'</code> so asset paths resolve correctly.
      </p>
    </div>
  </body>
</html>
