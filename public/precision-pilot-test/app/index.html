<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Precision Pilot — pre-release (test)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0a0a0a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        border: 1px solid rgba(245, 158, 11, 0.35);
        border-radius: 0.75rem;
        padding: 1.75rem;
        background: #1c1410;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.45);
        padding: 0.2rem 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
        color: #f3f4f6;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: #9ca3af;
        line-height: 1.65;
      }
      .amber {
        color: #fbbf24;
      }
      code {
        font-size: 0.75rem;
        color: #fbbf24;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card" role="region" aria-label="Precision Pilot test web client">
      <div class="badge">Pre-release</div>
      <h1><span class="amber">Precision Pilot</span> — test web client</h1>
      <p>
        Placeholder for staging builds. Deploy into <code>public/precision-pilot-test/app/</code> with
        <code>base: '/precision-pilot-test/app/'</code>. URL flags from the shell may append for debugging.
      </p>
    </div>
  </body>
</html>
