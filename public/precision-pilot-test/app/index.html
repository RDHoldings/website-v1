<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/precision-pilot-test/app/">

  <meta charset="UTF-8">
  <!--
    Test shell bridge: forward console + client errors to parent iframe.
    Also: Maps/fetch diagnostics, optional UI stack traces (?debugTrace=1).
    Server-side / Firebase logs are not visible here — only this browser context.
  -->
  <script>
  (function () {
    try {
      if (window.parent === window) return;
      var O = window.location.origin;
      var debugTrace = /\bdebugTrace=1\b/.test(window.location.search || '');

      function stringify(a) {
        if (a instanceof Error) {
          return a.name + ': ' + a.message + (a.stack ? '\n' + a.stack : '');
        }
        if (typeof a === 'object' && a !== null) {
          try {
            return JSON.stringify(a);
          } catch (e) {
            return Object.prototype.toString.call(a);
          }
        }
        return String(a);
      }

      function collectStacks(args) {
        var out = [];
        for (var i = 0; i < args.length; i++) {
          if (args[i] instanceof Error && args[i].stack) out.push(args[i].stack);
        }
        return out.length ? out.join('\n--- next Error ---\n') : '';
      }

      function send(level, args) {
        var parts = [];
        for (var i = 0; i < args.length; i++) parts.push(stringify(args[i]));
        var msg = parts.join(' ');
        var stack = collectStacks(args);
        window.parent.postMessage(
          {
            source: 'flutter-console',
            level: level,
            message: msg,
            at: new Date().toISOString(),
            stack: stack || undefined,
            href: window.location.href,
          },
          O,
        );
      }

      ['log', 'info', 'debug', 'warn', 'error'].forEach(function (level) {
        var orig = console[level];
        if (typeof orig !== 'function') return;
        console[level] = function () {
          var a = Array.prototype.slice.call(arguments);
          send(level, a);
          return orig.apply(console, arguments);
        };
      });

      window.addEventListener(
        'error',
        function (ev) {
          var err = ev.error;
          var stack = err && err.stack ? err.stack : '';
          send('error', [
            '[window.error]',
            ev.message,
            (ev.filename || '') + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0),
            err || undefined,
          ]);
        },
        true,
      );

      window.addEventListener('unhandledrejection', function (ev) {
        send('error', ['[unhandledrejection]', ev.reason]);
      });

      /* Failed / non-OK fetch — geocoding & API calls often surface here */
      if (typeof window.fetch === 'function') {
        var ofetch = window.fetch;
        window.fetch = function (input, init) {
          var url =
            typeof input === 'string'
              ? input
              : input && input.url
                ? input.url
                : String(input);
          return ofetch
            .apply(this, arguments)
            .then(function (r) {
              if (!r.ok) {
                console.error('[fetch]', r.status, r.statusText, url);
              }
              return r;
            })
            .catch(function (e) {
              console.error('[fetch] failed', url, e);
              throw e;
            });
        };
      }

      /* Maps: placeholder key (immediate); google.maps (after async script has time to load) */
      function auditMapsPlaceholder() {
        var scripts = document.querySelectorAll('script[src*="maps.googleapis.com"]');
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src.indexOf('YOUR_GOOGLE_MAPS_WEB_API_KEY') !== -1) {
            console.error(
              '[Maps] Deploy still has YOUR_GOOGLE_MAPS_WEB_API_KEY in index.html. Set GitHub Actions secret GOOGLE_MAPS_WEB_API_KEY and rebuild so inject-google-maps-key.mjs can replace it.',
            );
          }
        }
      }
      var mapsDiagDone = false;
      function auditMapsAfterDelay() {
        if (mapsDiagDone) return;
        mapsDiagDone = true;
        if (typeof google !== 'undefined' && google.maps) {
          console.info(
            '[Maps] google.maps is available. If the map is still blank, check Flutter google_maps_flutter_web config. HERE / other geocoding providers are configured in the Flutter app, not this HTML shell.',
          );
        } else {
          console.error(
            '[Maps] google.maps not available after load. Common causes: (1) GOOGLE_MAPS_WEB_API_KEY not set at build, (2) Maps JavaScript API disabled in Google Cloud, (3) billing, (4) API key HTTP referrer restrictions blocking this origin. HERE and other fallbacks are implemented in the Flutter/Dart code — not in this static site.',
          );
        }
      }
      setTimeout(auditMapsPlaceholder, 0);
      setTimeout(auditMapsAfterDelay, 9000);

      /* Optional: stack for each pointer interaction (noisy; use ?debugTrace=1) */
      if (debugTrace) {
        console.warn(
          '[debugTrace] UI pointer stacks enabled — add debugTrace=1 to the app URL (test shell iframe src).',
        );
        ['pointerdown', 'click'].forEach(function (type) {
          document.addEventListener(
            type,
            function (ev) {
              var t = ev.target && ev.target.tagName ? ev.target.tagName : '?';
              var stack = new Error('[ui ' + type + '] ' + t).stack;
              console.debug('[ui]', type, t, stack);
            },
            true,
          );
        });
      }
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Precision Pilot — pre-release test (web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="precision_freight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Precision Pilot (test)</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS API — key injected at build via GOOGLE_MAPS_WEB_API_KEY (never commit real keys). See README. -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_WEB_API_KEY&amp;loading=async"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
