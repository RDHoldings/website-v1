<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/precision-pilot-test/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Precision Pilot — fleet and driver operations.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Precision Pilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="google-signin-client_id" content="453774050329-d0khjuitloabr5fa306b7tkc9a3nc5jb.apps.googleusercontent.com">

  <title>Precision Pilot</title>
  <link rel="manifest" href="manifest.json">

  <!-- Maps JavaScript API is injected at runtime from AppConfig (getClientApiConfig / dart-define). See lib/services/google_maps_js_loader_web.dart -->
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <!--
    Do not register a second service worker here. Flutter's flutter_bootstrap.js
    already registers the build's worker (e.g. flutter_service_worker.js). A custom
    sw.js alongside it caused prepareServiceWorker timeouts and broken caching on web.
  -->
  <!-- defer (not async): pdf.js module scripts must run first so globalThis.pdfjsLib exists before PdfxWeb asserts -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
