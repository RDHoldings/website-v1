# Build verification on health / code-quality branches (no Pages deploy).
name: CI verify

on:
  push:
    branches:
      - 'cursor/code-quality-and-ci-health-*'
      - 'cursor/project-health-review-*'
      - 'cursor/project-health-cleanup-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Markdown lint
        run: npx --yes markdownlint-cli2

      - name: Install dependencies
        run: npm ci

      - name: Build website bundle
        run: npm run build

      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Verify dist layout + embeds
        run: |
          set -e
          for name in precision-pilot precision-pilot-test living-bible living-bible-test privacy terms access-request admin/access; do
            if [ ! -f "dist/$name/index.html" ]; then
              echo "dist/$name/index.html missing"
              exit 1
            fi
          done
          for name in precision-pilot precision-pilot-test; do
            for f in index.html flutter_bootstrap.js main.dart.js; do
              if [ ! -f "dist/$name/app/$f" ]; then
                echo "dist/$name/app/$f missing"
                exit 1
              fi
            done
          done

      - name: ESLint
        run: npm run lint

      - name: Cloud Functions lint
        run: npm run lint:functions
