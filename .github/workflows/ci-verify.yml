# Verification on health / code-quality branches (no Pages deploy).
name: CI verify

on:
  push:
    branches:
      - 'cursor/code-quality-and-ci-health-*'
      - 'cursor/project-health-review-*'
      - 'cursor/project-health-cleanup-*'
      - 'cursor/project-health-improvements-*'
      - 'cursor/project-health-check-*'
      - 'cursor/local-and-ci-health-*'
      - 'cursor/bc-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Markdown lint
        run: npx --yes markdownlint-cli2

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Functions lint
        run: npm run lint:functions

      - name: Functions tests
        run: npm run test:functions
