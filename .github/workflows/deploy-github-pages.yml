# Build Vite app and deploy to GitHub Pages (static + SPA fallback)
# Repo: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Vite copies public/ → dist/ (includes public/precision-pilot/** and public/precision-pilot-test/**)
        # For github.io project URLs only, set repo variable VITE_BASE_URL (e.g. /website-v1/) so iframe paths match.
        env:
          # Empty when unset — avoids odd string values in some runners; custom domain = leave unset (base '/')
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '' }}
          # Maps JS in Flutter embed index.html (see scripts/inject-google-maps-key.mjs)
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
          # Flutter web assets/.env — injected by scripts/inject-flutter-web-env.mjs (never commit values)
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          HERE_APP_ID: ${{ secrets.HERE_APP_ID }}
          ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          APP_INVITE_BASE_URL: ${{ vars.APP_INVITE_BASE_URL || '' }}
          # Set to 'true' only if you accept exposing Resend in the client (not recommended)
          INJECT_FLUTTER_WEB_INCLUDE_RESEND: ${{ vars.INJECT_FLUTTER_WEB_INCLUDE_RESEND || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # GitHub Pages serves 404.html for unknown paths — same as index.html so React Router works on refresh
      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      # Single artifact: main SPA + any static assets under dist/precision-pilot/ and dist/precision-pilot-test/
      - name: Verify published layout (SPA + optional PP static bundles)
        run: |
          set -e
          ls -la dist
          echo ""
          for name in precision-pilot precision-pilot-test privacy terms; do
            if [ ! -f "dist/$name/index.html" ]; then
              echo "dist/$name/index.html missing (postbuild SPA shells); failing"
              exit 1
            fi
          done
          for name in precision-pilot precision-pilot-test; do
            if [ -d "dist/$name" ]; then
              count=$(find "dist/$name" -type f | wc -l)
              echo "dist/$name: $count file(s) (PP static bundle + SPA shell index.html)"
            else
              echo "dist/$name: missing (unexpected — public/ should always copy); failing"
              exit 1
            fi
            for f in index.html flutter_bootstrap.js main.dart.js; do
              if [ ! -f "dist/$name/app/$f" ]; then
                echo "dist/$name/app/$f missing (Flutter web bundle); failing"
                exit 1
              fi
            done
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
