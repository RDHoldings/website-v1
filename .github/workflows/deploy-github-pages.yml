# Build Vite app and deploy to GitHub Pages (static + SPA fallback)
# Repo: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Vite copies public/ → dist/ (includes public/precision-pilot/** and public/precision-pilot-test/**)

      # GitHub Pages serves 404.html for unknown paths — same as index.html so React Router works on refresh
      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      # Single artifact: main SPA + any static assets under dist/precision-pilot/ and dist/precision-pilot-test/
      - name: Verify published layout (SPA + optional PP static bundles)
        run: |
          set -e
          ls -la dist
          echo ""
          for name in precision-pilot precision-pilot-test; do
            if [ -d "dist/$name" ]; then
              count=$(find "dist/$name" -type f | wc -l)
              echo "dist/$name: $count file(s) (from public/$name — shipped with this deploy)"
            else
              echo "dist/$name: missing (unexpected — public/ should always copy); failing"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
