    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android APKs: built from the private Flutter repo when FLUTTER_APP_CHECKOUT_TOKEN is set on this repo.
      # Paths must match src/config/precisionPilot.js (PRECISION_PILOT_APK).
      # Without the PAT, checkout of RDHoldings/precision-freight fails (anonymous HTTPS or GITHUB_TOKEN → 404).
      # We then create empty placeholder .apk files so Vite + verify still succeed; set the secret for real builds.
      - name: Configure Flutter APK build
        id: flutter_apk
        env:
          FLUTTER_APP_CHECKOUT_TOKEN: ${{ secrets.FLUTTER_APP_CHECKOUT_TOKEN }}
        run: |
          set -e
          if [ -n "$FLUTTER_APP_CHECKOUT_TOKEN" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLUTTER_APP_CHECKOUT_TOKEN not set — using empty APK placeholders. Add a fine-grained PAT (Contents: Read on RDHoldings/precision-freight) as this repository secret to build real APKs."
          fi

      - name: Checkout Precision Pilot (Flutter)
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLUTTER_APP_REPO || 'RDHoldings/precision-freight' }}
          path: precision-pilot-app
          token: ${{ secrets.FLUTTER_APP_CHECKOUT_TOKEN }}
          fetch-depth: 1

      - name: Set up Java (Android)
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        working-directory: precision-pilot-app
        run: flutter pub get

      - name: Build Android APKs (release + debug)
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        working-directory: precision-pilot-app
        run: |
          set -e
          flutter build apk --release
          flutter build apk --debug

      - name: Stage APKs into website public/
        if: ${{ steps.flutter_apk.outputs.build == 'true' }}
        run: |
          set -e
          mkdir -p public/precision-pilot/downloads public/precision-pilot-test/downloads
          cp precision-pilot-app/build/app/outputs/flutter-apk/app-release.apk \
            public/precision-pilot/downloads/precision-pilot-release.apk
          cp precision-pilot-app/build/app/outputs/flutter-apk/app-debug.apk \
            public/precision-pilot-test/downloads/precision-pilot-debug.apk
          ls -la public/precision-pilot/downloads/
          ls -la public/precision-pilot-test/downloads/

      - name: Placeholder APKs when Flutter PAT is not configured
        if: ${{ steps.flutter_apk.outputs.build != 'true' }}
        run: |
          set -e
          mkdir -p public/precision-pilot/downloads public/precision-pilot-test/downloads
          : > public/precision-pilot/downloads/precision-pilot-release.apk
          : > public/precision-pilot-test/downloads/precision-pilot-debug.apk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website bundle
        run: npm run build
        # Vite copies public/ → dist/ (includes public/precision-pilot/** and public/precision-pilot-test/**)
