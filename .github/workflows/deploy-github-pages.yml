# Build Vite app and deploy to GitHub Pages (static + SPA fallback)
# Repo: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy website + Pages

on:
  push:
    branches:
      - main
      - 'cursor/project-health-review-*'
      - 'cursor/project-health-cleanup-*'
      - 'cursor/codebase-health-cleanup-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Grouped env keeps Build step readable while preserving all integration knobs.
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '' }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || '' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || '' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '' }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || '' }}
      GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
      HERE_APP_ID: ${{ secrets.HERE_APP_ID }}
      ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      APP_INVITE_BASE_URL: ${{ vars.APP_INVITE_BASE_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website bundle
        run: npm run build
        # Vite copies public/ → dist/ (includes public/precision-pilot/** and public/precision-pilot-test/**)
        # For github.io project URLs only, set repo variable VITE_BASE_URL (e.g. /website-v1/) so iframe paths match.

      # GitHub Pages serves 404.html for unknown paths — same as index.html so React Router works on refresh
      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      # Single artifact: main SPA + static app bundles under precision-pilot*/app and living-bible*/app
      - name: Verify dist layout + embeds
        run: |
          set -e
          ls -la dist
          echo ""
          for name in precision-pilot precision-pilot-test living-bible living-bible-test privacy terms access-request admin/access; do
            if [ ! -f "dist/$name/index.html" ]; then
              echo "dist/$name/index.html missing (postbuild SPA shells); failing"
              exit 1
            fi
          done
          for name in precision-pilot precision-pilot-test; do
            if [ -d "dist/$name" ]; then
              count=$(find "dist/$name" -type f | wc -l)
              echo "dist/$name: $count file(s) (PP static bundle + SPA shell index.html)"
            else
              echo "dist/$name: missing (unexpected — public/ should always copy); failing"
              exit 1
            fi
            for f in index.html flutter_bootstrap.js main.dart.js; do
              if [ ! -f "dist/$name/app/$f" ]; then
                echo "dist/$name/app/$f missing (Flutter web bundle); failing"
                exit 1
              fi
            done
          done
          # Precision Pilot embed verification
          verify_pp_embed_index() {
            local f="$1"
            local label="$2"
            if ! grep -q 'pdfRenderOptions' "$f"; then
              echo "::error::$label: missing pdfRenderOptions (pdfx). Add pdf.js per Flutter web/index.html."
              exit 1
            fi
            if ! grep -q 'pdfjs-dist' "$f"; then
              echo "::error::$label: missing pdfjs-dist (pdfx)"
              exit 1
            fi
            if grep -q 'src="flutter_bootstrap.js" async' "$f"; then
              echo "::error::$label: flutter_bootstrap.js must use defer, not async"
              exit 1
            fi
            if ! grep -q 'src="flutter_bootstrap.js" defer' "$f"; then
              echo "::error::$label: expected defer on flutter_bootstrap.js"
              exit 1
            fi
          }
          verify_pp_embed_index dist/precision-pilot/app/index.html "production Flutter embed"
          verify_pp_embed_index dist/precision-pilot-test/app/index.html "test Flutter embed"
          # Living Bible Expo embed verification: routed _expo/static assets under expected path prefix
          verify_lb_embed_index() {
            local f="$1"
            local label="$2"
            local expected_prefix="$3"
            if [ ! -f "$f" ]; then
              echo "::error::$label: missing index.html"
              exit 1
            fi
            if ! grep -q "_expo/static" "$f"; then
              echo "::error::$label: missing _expo/static references"
              exit 1
            fi
            if ! grep -q "$expected_prefix/_expo/static/" "$f"; then
              echo "::error::$label: missing expected path prefix $expected_prefix/_expo/static/"
              exit 1
            fi
          }
          verify_lb_embed_index dist/living-bible/app/index.html "production Expo embed" "/living-bible/app"
          verify_lb_embed_index dist/living-bible-test/app/index.html "test Expo embed" "/living-bible-test/app"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy_firebase_backend:
    # Intentional complexity: functions/rules deploy is isolated so Pages deploy can proceed independently.
    if: github.ref == 'refs/heads/main' && (vars.FIREBASE_PROJECT_ID != '' || vars.VITE_FIREBASE_PROJECT_ID != '')
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID_RESOLVED: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Check backend deploy prerequisites
        id: precheck
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SERVICE_ACCOUNT_JSON: ${{ secrets.GMAIL_SERVICE_ACCOUNT_JSON }}
          BOOTSTRAP_AUTOMATION_KEY: ${{ secrets.BOOTSTRAP_AUTOMATION_KEY }}
        run: |
          set -e
          missing=0
          if [ -z "$BOOTSTRAP_AUTOMATION_KEY" ]; then
            echo "::warning::Missing required secret: BOOTSTRAP_AUTOMATION_KEY"
            missing=1
          fi
          oauth_ok=0
          if [ -n "$GMAIL_CLIENT_ID" ] && [ -n "$GMAIL_CLIENT_SECRET" ] && [ -n "$GMAIL_REFRESH_TOKEN" ]; then
            oauth_ok=1
          fi
          sa_ok=0
          if printf '%s' "$GMAIL_SERVICE_ACCOUNT_JSON" | grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
            sa_ok=1
          elif [ -n "$GMAIL_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GMAIL_SERVICE_ACCOUNT_JSON is set but does not look like service account JSON"
          fi
          if [ "$oauth_ok" -eq 0 ] && [ "$sa_ok" -eq 0 ]; then
            echo "::warning::Missing Gmail delivery: set OAuth trio or valid GMAIL_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase backend deploy; Pages deploy remains unaffected."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "oauth_ok=$oauth_ok" >> "$GITHUB_OUTPUT"
            echo "sa_ok=$sa_ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Firebase service account key
        if: steps.precheck.outputs.ready == 'true' && steps.precheck.outputs.sa_ok == '1'
        env:
          GMAIL_SERVICE_ACCOUNT_JSON: ${{ secrets.GMAIL_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          printf '%s' "$GMAIL_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Sync Firebase function secrets (Gmail)
        if: steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SERVICE_ACCOUNT_JSON: ${{ secrets.GMAIL_SERVICE_ACCOUNT_JSON }}
          BOOTSTRAP_AUTOMATION_KEY: ${{ secrets.BOOTSTRAP_AUTOMATION_KEY }}
        run: |
          sync_secret() {
            printf '%s' "$2" | firebase functions:secrets:set "$1" --project "$FIREBASE_PROJECT_ID_RESOLVED" --non-interactive --data-file - \
              || echo "::warning::Could not sync secret $1 (using existing Firebase version)."
          }
          if [ "${{ steps.precheck.outputs.oauth_ok }}" = "1" ]; then
            sync_secret GMAIL_CLIENT_ID "$GMAIL_CLIENT_ID"
            sync_secret GMAIL_CLIENT_SECRET "$GMAIL_CLIENT_SECRET"
            sync_secret GMAIL_REFRESH_TOKEN "$GMAIL_REFRESH_TOKEN"
          fi
          if [ "${{ steps.precheck.outputs.sa_ok }}" = "1" ]; then
            sync_secret GMAIL_SERVICE_ACCOUNT_JSON "$GMAIL_SERVICE_ACCOUNT_JSON"
          fi
          sync_secret BOOTSTRAP_AUTOMATION_KEY "$BOOTSTRAP_AUTOMATION_KEY"

      - name: Deploy website Cloud Functions
        if: steps.precheck.outputs.ready == 'true'
        run: firebase deploy --project "$FIREBASE_PROJECT_ID_RESOLVED" --only functions:website --non-interactive
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.VITE_BOOTSTRAP_ADMIN_EMAIL || 'marc77014@gmail.com' }}

      - name: Bootstrap initial invite email
        if: steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.VITE_BOOTSTRAP_ADMIN_EMAIL || 'marc77014@gmail.com' }}
          BOOTSTRAP_AUTOMATION_KEY: ${{ secrets.BOOTSTRAP_AUTOMATION_KEY }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION || 'us-central1' }}
        run: |
          set -e
          node functions/scripts/bootstrap-invite.mjs --project "$FIREBASE_PROJECT_ID_RESOLVED" --email "$BOOTSTRAP_ADMIN_EMAIL" --region "$VITE_FIREBASE_FUNCTIONS_REGION" --automation-key "$BOOTSTRAP_AUTOMATION_KEY"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
